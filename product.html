<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Produkt - Rimtech Dynamics</title>
  <meta name="description" content="Szczegóły produktu Rimtech Dynamics - koła do supermoto." />

  <link rel="icon" type="image/png" href="/images/favicon.png" />
  <link rel="apple-touch-icon" href="/images/favicon.png" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a href="/" class="logo-wrap">
        <img
          src="/images/logo-rtd.png"
          alt="RTD Rimtech Dynamics"
          class="site-logo"
        />

        <div class="logo-text">
          <strong>Rimtech</strong>
          <span>Dynamics</span>
        </div>
      </a>

      <nav class="nav">
        <a href="/">Strona główna</a>
        <a href="/#produkty">Produkty</a>
        <a href="/o-nas.html">O nas</a>
        <a href="/faq.html">FAQ</a>
        <a href="/blog.html">Blog</a>
        <a href="/#kontakt">Kontakt</a>
        <a href="/cart.html" class="cart-link">Koszyk (<span id="cart-count">0</span>)</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="section">
      <div id="product-details">
        <p>Ładowanie produktu...</p>
      </div>
    </section>
  </main>

  <div class="image-lightbox" id="image-lightbox" aria-hidden="true" hidden>
    <button class="image-lightbox-close" id="lightbox-close" type="button" aria-label="Zamknij zdjęcie">×</button>

    <button class="image-lightbox-arrow image-lightbox-prev" id="lightbox-prev" type="button" aria-label="Poprzednie zdjęcie">‹</button>

    <div class="image-lightbox-stage">
      <img id="lightbox-image" class="image-lightbox-image" src="" alt="Powiększone zdjęcie produktu">
    </div>

    <button class="image-lightbox-arrow image-lightbox-next" id="lightbox-next" type="button" aria-label="Następne zdjęcie">›</button>

    <div class="image-lightbox-hint">
      Kliknij zdjęcie, aby przybliżyć / oddalić
    </div>
  </div>

  <footer class="site-footer">
    <div>
      Rimtech Dynamics © 2026
    </div>

    <div class="footer-links">
      <a href="/legal.html?doc=regulamin">Regulamin</a>
      <a href="/legal.html?doc=polityka-prywatnosci">Polityka prywatności</a>
      <a href="/legal.html?doc=polityka-cookies">Cookies</a>
      <a href="/legal.html?doc=zwroty-reklamacje">Zwroty i reklamacje</a>
      <a href="/legal.html?doc=dostawa-platnosci">Dostawa i płatności</a>
    </div>
  </footer>

  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>

  <script>
    let currentGalleryImages = [];
    let currentGalleryIndex = 0;

    function getSlugFromUrl() {
      const params = new URLSearchParams(window.location.search);
      return params.get('slug');
    }

    function escapeHtml(value) {
      return String(value || '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function formatPrice(price, currency = 'PLN') {
      return new Intl.NumberFormat('pl-PL', {
        style: 'currency',
        currency: currency || 'PLN'
      }).format(Number(price || 0));
    }

    function getCart() {
      try {
        return JSON.parse(localStorage.getItem('rimtech_cart')) || [];
      } catch (error) {
        return [];
      }
    }

    function saveCart(cart) {
      localStorage.setItem('rimtech_cart', JSON.stringify(cart));
      updateCartCount();
    }

    function updateCartCount() {
      const cartCount = document.getElementById('cart-count');

      if (!cartCount) {
        return;
      }

      const cart = getCart();
      const count = cart.reduce((sum, item) => {
        return sum + Number(item.quantity || 1);
      }, 0);

      cartCount.textContent = count;
    }

    function addProductToCart(product) {
      const cart = getCart();
      const existingProduct = cart.find(item => item.slug === product.slug);
      const quantity = Number(product.quantity || 1);

      if (existingProduct) {
        existingProduct.quantity = Number(existingProduct.quantity || 1) + quantity;
      } else {
        cart.push({
          slug: product.slug,
          title: product.title,
          price: Number(product.price || 0),
          currency: product.currency || 'PLN',
          image: product.image || '',
          quantity: quantity
        });
      }

      saveCart(cart);
    }

        function normalizeList(list, fallbackKey) {
      if (typeof list === 'string' && list.trim()) {
        return [list.trim()];
      }

      if (!Array.isArray(list)) {
        return [];
      }

      return list
        .map(item => {
          if (typeof item === 'string') {
            return item;
          }

          if (item && typeof item === 'object') {
            return item[fallbackKey] || item.item || item.color || item.model || item.image || '';
          }

          return '';
        })
        .filter(Boolean);
    }
    function renderList(list, fallbackKey, className = 'compatibility') {
      const items = normalizeList(list, fallbackKey);

      if (!items.length) {
        return '';
      }

      return `
        <ul class="${className}">
          ${items.map(item => `<li>${escapeHtml(item)}</li>`).join('')}
        </ul>
      `;
    }

    function renderDescription(description) {
      if (!description) {
        return '<p>Opis produktu zostanie uzupełniony wkrótce.</p>';
      }

      const paragraphs = String(description)
        .split(/\n{2,}/)
        .map(part => part.trim())
        .filter(Boolean);

      return paragraphs
        .map(part => `<p>${escapeHtml(part).replaceAll('\n', '<br>')}</p>`)
        .join('');
    }

    function buildProductImages(product) {
      const images = [];

      if (product.main_image) {
        images.push(product.main_image);
      }

      normalizeList(product.gallery, 'image').forEach(image => {
        if (image && !images.includes(image)) {
          images.push(image);
        }
      });

      return images;
    }

    function renderProductGallery(product) {
      const images = buildProductImages(product);

      if (!images.length) {
        return `
          <div class="product-page-gallery">
            <div class="product-main-image-wrap">
              <div class="product-page-image product-page-image-placeholder"></div>
            </div>
          </div>
        `;
      }

      const thumbnails = images.map((image, index) => `
        <button
          class="product-thumbnail ${index === 0 ? 'active' : ''}"
          type="button"
          data-gallery-index="${index}"
          aria-label="Pokaż zdjęcie ${index + 1}"
        >
          <img src="${escapeHtml(image)}" alt="${escapeHtml(product.title)} - zdjęcie ${index + 1}">
        </button>
      `).join('');

      const arrows = images.length > 1
        ? `
          <button class="gallery-arrow gallery-arrow-prev" type="button" id="gallery-prev" aria-label="Poprzednie zdjęcie">‹</button>
          <button class="gallery-arrow gallery-arrow-next" type="button" id="gallery-next" aria-label="Następne zdjęcie">›</button>
        `
        : '';

      return `
        <div class="product-page-gallery">
          <div class="product-main-image-wrap">
            <img
              id="active-product-image"
              class="product-page-image zoomable-product-image"
              src="${escapeHtml(images[0])}"
              alt="${escapeHtml(product.title)}"
            >

            ${arrows}
          </div>

          ${images.length > 1 ? `
            <div class="product-thumbnails" aria-label="Miniatury zdjęć produktu">
              ${thumbnails}
            </div>
          ` : ''}
        </div>
      `;
    }

    function setActiveProductImage(index) {
      if (!currentGalleryImages.length) {
        return;
      }

      currentGalleryIndex = (index + currentGalleryImages.length) % currentGalleryImages.length;

      const activeImage = document.getElementById('active-product-image');

      if (activeImage) {
        activeImage.src = currentGalleryImages[currentGalleryIndex];
      }

      document.querySelectorAll('.product-thumbnail').forEach(button => {
        const buttonIndex = Number(button.dataset.galleryIndex);
        button.classList.toggle('active', buttonIndex === currentGalleryIndex);
      });
    }

    function setLightboxImage(index) {
      if (!currentGalleryImages.length) {
        return;
      }

      currentGalleryIndex = (index + currentGalleryImages.length) % currentGalleryImages.length;

      const lightboxImage = document.getElementById('lightbox-image');

      if (lightboxImage) {
        lightboxImage.src = currentGalleryImages[currentGalleryIndex];
      }

      setActiveProductImage(currentGalleryIndex);
    }

    function openProductLightbox(index) {
      const lightbox = document.getElementById('image-lightbox');

      if (!lightbox) {
        return;
      }

      lightbox.hidden = false;
      setLightboxImage(index);

      lightbox.classList.add('active');
      lightbox.classList.remove('zoomed');
      lightbox.setAttribute('aria-hidden', 'false');
      document.body.classList.add('lightbox-open');
    }

    function closeProductLightbox() {
      const lightbox = document.getElementById('image-lightbox');

      if (!lightbox) {
        return;
      }

      lightbox.classList.remove('active');
      lightbox.classList.remove('zoomed');
      lightbox.setAttribute('aria-hidden', 'true');
      document.body.classList.remove('lightbox-open');
      lightbox.hidden = true;
    }

    function setupProductLightbox() {
      const lightbox = document.getElementById('image-lightbox');
      const closeButton = document.getElementById('lightbox-close');
      const previousButton = document.getElementById('lightbox-prev');
      const nextButton = document.getElementById('lightbox-next');
      const lightboxImage = document.getElementById('lightbox-image');

      if (!lightbox) {
        return;
      }

      if (closeButton) {
        closeButton.onclick = closeProductLightbox;
      }

      if (previousButton) {
        previousButton.onclick = () => {
          setLightboxImage(currentGalleryIndex - 1);
        };
      }

      if (nextButton) {
        nextButton.onclick = () => {
          setLightboxImage(currentGalleryIndex + 1);
        };
      }

      if (lightboxImage) {
        lightboxImage.onclick = () => {
          lightbox.classList.toggle('zoomed');
        };
      }

      lightbox.onclick = event => {
        if (event.target === lightbox) {
          closeProductLightbox();
        }
      };

      document.onkeydown = event => {
        if (!lightbox.classList.contains('active')) {
          return;
        }

        if (event.key === 'Escape') {
          closeProductLightbox();
        }

        if (event.key === 'ArrowLeft') {
          setLightboxImage(currentGalleryIndex - 1);
        }

        if (event.key === 'ArrowRight') {
          setLightboxImage(currentGalleryIndex + 1);
        }
      };
    }

    function setupProductGallery() {
      document.querySelectorAll('.product-thumbnail').forEach(button => {
        button.addEventListener('click', () => {
          setActiveProductImage(Number(button.dataset.galleryIndex));
        });
      });

      const previousButton = document.getElementById('gallery-prev');
      const nextButton = document.getElementById('gallery-next');

      if (previousButton) {
        previousButton.addEventListener('click', () => {
          setActiveProductImage(currentGalleryIndex - 1);
        });
      }

      if (nextButton) {
        nextButton.addEventListener('click', () => {
          setActiveProductImage(currentGalleryIndex + 1);
        });
      }

      const activeImage = document.getElementById('active-product-image');

      if (activeImage) {
        activeImage.addEventListener('click', () => {
          openProductLightbox(currentGalleryIndex);
        });

        activeImage.addEventListener('keydown', event => {
          if (event.key === 'Enter' || event.key === ' ') {
            event.preventDefault();
            openProductLightbox(currentGalleryIndex);
          }
        });

        activeImage.setAttribute('tabindex', '0');
        activeImage.setAttribute('role', 'button');
        activeImage.setAttribute('aria-label', 'Powiększ zdjęcie produktu');
      }

      setupProductLightbox();
    }

    function setMetaTag(selector, attribute, value) {
      let tag = document.head.querySelector(selector);

      if (!tag) {
        tag = document.createElement('meta');

        if (selector.includes('property=')) {
          tag.setAttribute('property', selector.split('"')[1]);
        } else if (selector.includes('name=')) {
          tag.setAttribute('name', selector.split('"')[1]);
        }

        document.head.appendChild(tag);
      }

      tag.setAttribute(attribute, value);
    }

    function updateProductSeo(product) {
      const rimColors = normalizeList(product.rim_colors, 'color').join(' / ');
      const hubColors = normalizeList(product.hub_colors, 'color').join(' / ');
      const colorDescription = rimColors && hubColors
        ? `Obręcze: ${rimColors}, piasty: ${hubColors}.`
        : '';

      const seoTitle = `${product.title} – koła Supermoto 17″ | Rimtech Dynamics`;
      const seoDescription = `Komplet kół Supermoto 17″ ${product.title.replace('Supermoto Set ', '')}. ${colorDescription} Piasty CNC, obręcze 7116-T6 i dopasowanie do KTM, Husqvarna, GasGas oraz innych motocykli.`;
      const canonicalUrl = `${window.location.origin}/product.html?slug=${encodeURIComponent(product.slug)}`;
      const imageUrl = product.main_image
        ? new URL(product.main_image, window.location.origin).href
        : '';

      document.title = seoTitle;
      document.querySelector('meta[name="description"]').setAttribute('content', seoDescription);

      let canonical = document.head.querySelector('link[rel="canonical"]');
      if (!canonical) {
        canonical = document.createElement('link');
        canonical.rel = 'canonical';
        document.head.appendChild(canonical);
      }
      canonical.href = canonicalUrl;

      setMetaTag('meta[property="og:type"]', 'content', 'product');
      setMetaTag('meta[property="og:title"]', 'content', seoTitle);
      setMetaTag('meta[property="og:description"]', 'content', seoDescription);
      setMetaTag('meta[property="og:url"]', 'content', canonicalUrl);
      if (imageUrl) {
        setMetaTag('meta[property="og:image"]', 'content', imageUrl);
      }
      setMetaTag('meta[name="twitter:card"]', 'content', 'summary_large_image');
      setMetaTag('meta[name="twitter:title"]', 'content', seoTitle);
      setMetaTag('meta[name="twitter:description"]', 'content', seoDescription);
      if (imageUrl) {
        setMetaTag('meta[name="twitter:image"]', 'content', imageUrl);
      }

      const structuredData = {
        '@context': 'https://schema.org',
        '@type': 'Product',
        name: product.title,
        description: seoDescription,
        image: buildProductImages(product).map(image => new URL(image, window.location.origin).href),
        sku: product.slug,
        brand: {
          '@type': 'Brand',
          name: 'Rimtech Dynamics'
        },
        offers: {
          '@type': 'Offer',
          url: canonicalUrl,
          priceCurrency: product.currency || 'PLN',
          price: Number(product.price || 0),
          availability: product.availability === 'Dostępny'
            ? 'https://schema.org/InStock'
            : 'https://schema.org/PreOrder',
          itemCondition: 'https://schema.org/NewCondition'
        }
      };

      let script = document.getElementById('product-structured-data');
      if (!script) {
        script = document.createElement('script');
        script.id = 'product-structured-data';
        script.type = 'application/ld+json';
        document.head.appendChild(script);
      }
      script.textContent = JSON.stringify(structuredData);
    }

    async function loadProduct() {
      const container = document.getElementById('product-details');
      const slug = getSlugFromUrl();

      if (!slug) {
        container.innerHTML = `
          <div class="contact-card">
            <h2>Nie znaleziono produktu</h2>
            <p>Brakuje identyfikatora produktu w adresie strony.</p>
            <a class="button" href="/#produkty">Wróć do produktów</a>
          </div>
        `;
        return;
      }

      try {
        const response = await fetch('/data/products.json');
        const data = await response.json();

        const product = (data.products || []).find(item => item.slug === slug && item.active);

        if (!product) {
          container.innerHTML = `
            <div class="contact-card">
              <h2>Nie znaleziono produktu</h2>
              <p>Ten produkt nie istnieje albo nie jest aktualnie aktywny.</p>
              <a class="button" href="/#produkty">Wróć do produktów</a>
            </div>
          `;
          return;
        }

        updateProductSeo(product);

        currentGalleryImages = buildProductImages(product);
        currentGalleryIndex = 0;

        const productForCart = {
          slug: product.slug,
          title: product.title,
          price: product.price,
          currency: product.currency || 'PLN',
          image: product.main_image || '',
          quantity: 1
        };

        const compatibility = renderList(product.compatibility, 'model');
        const included = renderList(product.included, 'item');
        const hubColors = renderList(product.hub_colors, 'color');
        const rimColors = renderList(product.rim_colors, 'color');

        container.innerHTML = `
          <div class="product-page">
            ${renderProductGallery(product)}

            <div class="product-page-info">
              <div class="section-kicker">Rimtech Dynamics</div>

              ${product.badge ? `<div class="availability">${escapeHtml(product.badge)}</div>` : ''}

              <h1>${escapeHtml(product.title)}</h1>

              <p class="product-page-short">
                ${escapeHtml(product.short_description)}
              </p>

              <div class="product-page-price">
                ${formatPrice(product.price, product.currency)}
              </div>

              <div class="availability">
                ${escapeHtml(product.availability || 'Na zamówienie')}
              </div>

              <div class="product-page-actions">
                <button class="button" type="button" id="buy-now-button">Kup teraz</button>
                <button class="button secondary" type="button" id="add-to-cart-button">Dodaj do koszyka</button>
              </div>

              <p class="product-page-short">
                Produkt może wymagać potwierdzenia dopasowania pod konkretny model, rocznik i konfigurację motocykla.
              </p>
            </div>
          </div>

          <div class="product-page-extra product-page-extra-wide">
            <div class="contact-card">
              <h2>Opis produktu</h2>
              ${renderDescription(product.description)}
            </div>
          </div>

          <div class="product-page-extra product-page-extra-wide">
            <div class="contact-card">
              <h2>Kompatybilność</h2>
              ${compatibility || '<p>Skontaktuj się z nami w celu potwierdzenia dopasowania.</p>'}
            </div>
          </div>

          <div class="product-page-extra">
            <div class="contact-card">
              <h2>Co zawiera zestaw</h2>
              ${included || '<p>Zakres zestawu zostanie potwierdzony przed zakupem.</p>'}
            </div>

            <div class="contact-card">
              <h2>Konfiguracja</h2>

              <div class="product-config-row">
                <strong>Piasty</strong>
                <div class="product-config-tags">
                  ${hubColors || '<span>Do ustalenia</span>'}
                </div>
              </div>

              <div class="product-config-row">
                <strong>Obręcze</strong>
                <div class="product-config-tags">
                  ${rimColors || '<span>Do ustalenia</span>'}
                </div>
              </div>
            </div>
          </div>

          <div class="product-page-extra">
            <div class="contact-card">
              <h2>Dostawa i płatność</h2>
              <p>Przed realizacją zamówienia potwierdzamy dopasowanie zestawu do motocykla oraz dostępność wybranej konfiguracji.</p>
              <p>Płatność online Przelewy24 zostanie uruchomiona po aktywacji konta płatniczego.</p>
              <p><a href="/legal.html?doc=dostawa-platnosci">Zobacz informacje o dostawie i płatności</a></p>
            </div>

            <div class="contact-card">
              <h2>Zwroty, reklamacje i gwarancja</h2>
              <p><strong>Na każdy produkt udzielamy dodatkowej miesięcznej gwarancji rozruchowej.</strong></p>
              <p>Przy zgłoszeniu zwrotu w ciągu 2 dni od odbioru pokrywamy koszt przesyłki zwrotnej. Ustawowe 14 dni na odstąpienie od umowy pozostaje bez zmian.</p>
              <p><a href="/legal.html?doc=zwroty-reklamacje">Zobacz pełne zasady zwrotów, reklamacji i gwarancji</a></p>
            </div>
          </div>
        `;

        setupProductGallery();

        const buyNowButton = document.getElementById('buy-now-button');
        const addToCartButton = document.getElementById('add-to-cart-button');

        buyNowButton.addEventListener('click', () => {
          addProductToCart(productForCart);
          window.location.href = '/cart.html';
        });

        addToCartButton.addEventListener('click', () => {
          addProductToCart(productForCart);
          addToCartButton.textContent = 'Dodano do koszyka';

          setTimeout(() => {
            addToCartButton.textContent = 'Dodaj do koszyka';
          }, 1600);
        });
      } catch (error) {
        console.error('Nie udało się załadować produktu:', error);
        container.innerHTML = `
          <div class="contact-card">
            <h2>Błąd ładowania produktu</h2>
            <p>Nie udało się załadować danych produktu. Spróbuj ponownie później.</p>
            <a class="button" href="/#produkty">Wróć do produktów</a>
          </div>
        `;
      }
    }

    loadProduct();
    updateCartCount();

    if (window.netlifyIdentity) {
      window.netlifyIdentity.on("init", user => {
        if (!user) {
          window.netlifyIdentity.on("login", () => {
            document.location.href = "/admin/";
          });
        }
      });
    }
  </script>
</body>
</html>
